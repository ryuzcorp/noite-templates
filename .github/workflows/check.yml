name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: ilha-void template
        run: |
          cd templates/ilha-void
          bun install
          bun run check
      - name: tanstack-start template
        run: |
          cd templates/tanstack-start
          bun install
          bun run check
      - name: agent template
        run: |
          cd templates/agent
          bun install
          bun run check

  agent-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image tag
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build sandbox image
        run: |
          docker build -f templates/agent/Dockerfile templates/agent \
            -t "ghcr.io/ryuzcorp/noite-templates-agent-sandbox:${SHORT_SHA}"
      - name: Push sandbox image (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/ryuzcorp/noite-templates-agent-sandbox:${SHORT_SHA}"
