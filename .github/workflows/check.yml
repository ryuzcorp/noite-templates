name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: ilha-void template
        run: |
          cd templates/ilha-void
          bun install
          bun run check
      - name: tanstack-start template
        run: |
          cd templates/tanstack-start
          bun install
          bun run check
      - name: agent template
        run: |
          cd templates/agent
          bun install
          bun run check
